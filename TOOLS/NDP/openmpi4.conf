# OpenMPI 4.x settings for an NDP (Kubernetes) pod, found by testing there.
# install.sh applies the openmpi<major>.conf that matches the installed
# OpenMPI and copies it into firetec-env.sh. One VAR=value per line; keep
# comments on their own lines.

# ptrace is blocked, so CMA single-copy fails ("Read -1, expected N, errno = 1")
OMPI_MCA_btl_vader_single_copy_mechanism=none
# /dev/shm is only 64 MB, so many ranks die with SIGBUS unless the
# shared-memory segments live in /tmp
OMPI_MCA_btl_vader_backing_directory=/tmp
# OpenMPI counts the 16 physical cores as slots, not the 32 hwthreads
OMPI_MCA_hwloc_base_use_hwthreads_as_cpus=1
# default core binding stacks concurrent jobs onto the same cores
OMPI_MCA_hwloc_base_binding_policy=none
