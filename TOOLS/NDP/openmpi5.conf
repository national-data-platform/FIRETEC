# OpenMPI 5.x settings for an NDP (Kubernetes) pod, found by testing there.
# install.sh applies the openmpi<major>.conf that matches the installed
# OpenMPI and copies it into firetec-env.sh. One VAR=value per line; keep
# comments on their own lines.

# the tcp BTL cannot pair the pod's interfaces and warns on every rank
OMPI_MCA_btl=self,sm
# /dev/shm is only 64 MB, so many ranks die with SIGBUS unless the
# shared-memory segments live in /tmp
OMPI_MCA_btl_sm_backing_directory=/tmp
# ptrace is blocked, so CMA single-copy cannot work (and is slower)
OMPI_MCA_smsc=^cma
# PRRTE counts the 16 physical cores as slots, not the 32 hwthreads
PRTE_MCA_prte_set_default_slots=hwthreads
# default core binding stacks concurrent jobs onto the same cores
PRTE_MCA_hwloc_default_binding_policy=none
